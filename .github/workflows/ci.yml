# Every push and pull request: type check, unit tests, build, and the end-to-end suite (the built
# extension in Chromium). The e2e suite runs in one worker; each test closes the pages it opened.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm 10.9 crashes resolving vitest's optional peers without it.
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
