# A local Elasticsearch (and, with --profile kibana, Kibana) for running the crawler worker on your machine.
# docs/onboarding/running-locally.md walks through it. Security is off: for a laptop only, never a shared host.
#   docker compose -f deploy/local/docker-compose.yml up -d                      # Elasticsearch on :9200
#   docker compose -f deploy/local/docker-compose.yml --profile kibana up -d     # and Kibana on :5601
#   docker compose -f deploy/local/docker-compose.yml down -v                    # stop, and drop the data
name: crawlpilot-local
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # A laptop's disk is often fuller than Elasticsearch's 90% watermark: it would then not place new indices
      # and every write would time out. Local only.
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    profiles: ["kibana"]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
volumes:
  es-data:
