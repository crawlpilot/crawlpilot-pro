<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Profile: posts in rows of three</title>
<!-- A photo grid split into rows of three (picker plan PK2): the cards are the posts, not the rows. -->
<style>body{margin:0;font:14px sans-serif}.h{height:200px;padding:20px}.g{width:930px;margin:auto}.r{display:flex;gap:4px;margin-bottom:4px}.p{width:306px;height:306px;display:block}.p img{width:100%;height:100%;object-fit:cover;display:block}</style>
</head><body>
<div class="h"><div>someone</div><div>12 posts</div></div>
<div class="g">
  <script>
    for (let r = 0; r < 4; r++) {
      let row = '<div class="r">';
      for (let c = 0; c < 3; c++) { const i = r * 3 + c + 1; row += `<div><a class="p" href="/p/post${i}/"><img alt="Photo ${i}" src="/img/post${i}-300x300.png"></a></div>`; }
      document.write(row + '</div>');
    }
  </script>
</div>
</body></html>
