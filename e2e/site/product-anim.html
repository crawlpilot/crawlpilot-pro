<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Product, animated sections</title>
<style>body{font:14px sans-serif;margin:24px}#panel{overflow:hidden;height:0}</style>
</head><body>
  <header><nav><a href="/">Home</a> <a href="/site/list-1.html">Lamps</a></nav></header>
  <h1 id="title"></h1>
  <p class="description">A warm, dimmable desk lamp with a weighted base and a two-metre fabric cable.</p>
  <button id="toggle" aria-expanded="false">Warranty</button>
  <div id="panel"></div>
  <p id="state"></p>
  <script>
    const id = new URLSearchParams(location.search).get('id') || '0';
    document.getElementById('title').textContent = 'Lamp model ' + id;
    document.getElementById('state').textContent = document.visibilityState;
    // Opens like an animation library: frame by frame with requestAnimationFrame, its content
    // mounted when the animation ends (a hidden tab never gets there without frames).
    document.getElementById('toggle').addEventListener('click', () => {
      const panel = document.getElementById('panel');
      const start = performance.now();
      const step = now => {
        const t = Math.min(1, (now - start) / 300);
        panel.style.height = (60 * t) + 'px';
        if (t < 1) { requestAnimationFrame(step); return; }
        panel.innerHTML = '<p class="warranty">' + id + ' year warranty</p>';
        document.getElementById('toggle').setAttribute('aria-expanded', 'true');
      };
      requestAnimationFrame(step);
    });
  </script>
</body></html>
