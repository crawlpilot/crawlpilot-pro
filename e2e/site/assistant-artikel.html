    <h1>Neue Fahrradwege in Berlin bis zum Jahr 2027</h1>
    <p>Der Senat plant 120 Kilometer neue Fahrradwege in der ganzen Stadt.</p>
    <p>Die Kosten liegen bei rund 85 Millionen Euro und werden vom Bund mitgetragen.</p>
    <p>Kritiker sagen, dass der Bau zu langsam vorankommt und Parkplätze wegfallen.</p>
